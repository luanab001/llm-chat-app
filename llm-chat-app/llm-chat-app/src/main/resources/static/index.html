<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexus — Chat com LLM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app">

    <!-- Barra lateral -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </span>
        <span class="brand-name">Nexus</span>
      </div>

      <button class="btn-new-chat" id="btnNewChat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Nova conversa
      </button>

      <div class="history-label">Conversas</div>
      <nav class="history-list" id="historyList" aria-label="Historico de conversas"></nav>

      <div class="sidebar-footer">
        <div class="model-pill">
          <span class="dot"></span>
          <span id="modelName">claude-sonnet-4-6</span>
        </div>
      </div>
    </aside>

    <!-- Area principal -->
    <main class="main">

      <header class="topbar">
        <button class="icon-btn" id="btnToggleSidebar" aria-label="Alternar barra lateral">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h1 class="topbar-title">Converse com o seu LLM</h1>
        <div class="topbar-status" id="topbarStatus">
          <span class="status-dot"></span>
          <span>Pronto</span>
        </div>
      </header>

      <section class="chat" id="chat">
        <div class="empty-state" id="emptyState">
          <div class="empty-glow" aria-hidden="true"></div>
          <h2>O que voce quer construir hoje?</h2>
          <p>Escreva uma mensagem abaixo para comecar a conversar com o modelo.</p>
          <div class="suggestions">
            <button class="suggestion-chip" data-text="Explique o que e uma API REST em termos simples">Explique uma API REST</button>
            <button class="suggestion-chip" data-text="Escreva uma funcao Java que ordena uma lista de numeros">Funcao Java de ordenacao</button>
            <button class="suggestion-chip" data-text="De 3 ideias de nomes para o meu novo app">Ideias de nomes</button>
          </div>
        </div>

        <div class="messages" id="messages" aria-live="polite"></div>
      </section>

      <form class="composer" id="composerForm">
        <div class="composer-box" id="composerBox">
          <textarea
            id="messageInput"
            class="composer-input"
            placeholder="Envie uma mensagem para o Nexus..."
            rows="1"
            maxlength="4000"
          ></textarea>
          <button type="submit" class="btn-send" id="btnSend" aria-label="Enviar mensagem" disabled>
            <svg class="icon-send" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
            <svg class="icon-stop" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
        </div>
        <p class="composer-hint">Enter envia · Shift+Enter quebra linha</p>
      </form>

    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
