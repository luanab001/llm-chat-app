# Porta do servidor
server.port=8080

# --- Provedor de LLM ---
# Chave lida da variavel de ambiente ANTHROPIC_API_KEY (nunca deixe a chave fixa no codigo)
llm.api-key=${ANTHROPIC_API_KEY:}
llm.api-url=https://api.anthropic.com/v1/messages
llm.model=claude-sonnet-4-6
llm.max-tokens=1024
llm.system-prompt=Voce e um assistente util, direto e cordial. Responda em portugues do Brasil.

# Logs mais enxutos
logging.level.org.springframework.web=INFO
